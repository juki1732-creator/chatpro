<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZaloNext - Online Cloud Version</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        zalo: '#0068FF',
                        zaloHover: '#0056d6',
                        zaloBg: '#F4F5F7'
                    },
                    height: {
                        'screen-app': '100dvh'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    </style>
</head>
<body class="w-full h-screen-app overflow-hidden flex flex-col m-0 p-0 text-gray-900 bg-zaloBg pt-safe">

    <!-- MAIN CONTAINER -->
    <main id="app-container" class="flex-1 w-full h-full relative flex flex-col overflow-hidden bg-white">
        <!-- Màn hình chờ kết nối Cloud -->
        <div class="flex-1 flex flex-col items-center justify-center p-6 bg-white text-center">
            <div class="w-16 h-16 bg-blue-50 text-zalo rounded-full flex items-center justify-center animate-spin mb-4">
                <i data-lucide="loader-2" class="w-8 h-8"></i>
            </div>
            <h3 class="font-bold text-lg text-gray-800">Đang kết nối hệ thống Cloud...</h3>
            <p class="text-xs text-gray-400 mt-1">Vui lòng chờ trong giây lát để đồng bộ dữ liệu trực tuyến.</p>
        </div>
    </main>

    <!-- BOTTOM TAB BAR -->
    <nav id="bottom-bar" class="w-full bg-white border-t border-gray-200 flex justify-around pb-safe z-40 shrink-0 hidden">
        <button onclick="switchTab('messages')" id="tab-messages" class="flex-1 flex flex-col items-center py-2 text-zalo transition-colors relative">
            <i data-lucide="message-circle" class="w-6 h-6"></i>
            <span class="text-[11px] mt-1 font-medium">Tin nhắn</span>
        </button>
        <button onclick="switchTab('contacts')" id="tab-contacts" class="flex-1 flex flex-col items-center py-2 text-gray-400 transition-colors">
            <i data-lucide="book-user" class="w-6 h-6"></i>
            <span class="text-[11px] mt-1 font-medium">Danh bạ</span>
        </button>
        <button onclick="switchTab('feed')" id="tab-feed" class="flex-1 flex flex-col items-center py-2 text-gray-400 transition-colors">
            <i data-lucide="compass" class="w-6 h-6"></i>
            <span class="text-[11px] mt-1 font-medium">Bảng tin</span>
        </button>
        <button onclick="switchTab('profile')" id="tab-profile" class="flex-1 flex flex-col items-center py-2 text-gray-400 transition-colors">
            <i data-lucide="user" class="w-6 h-6"></i>
            <span class="text-[11px] mt-1 font-medium">Cá nhân</span>
        </button>
    </nav>

    <!-- TOAST -->
    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white px-5 py-2.5 rounded-full text-xs font-medium shadow-xl z-[100] transform -translate-y-16 opacity-0 transition-all duration-300 pointer-events-none flex items-center space-x-2">
        <i data-lucide="info" class="w-4 h-4 text-blue-400"></i>
        <span id="toast-msg">Thông báo</span>
    </div>

    <!-- MODAL: KẾT BẠN -->
    <div id="add-friend-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex-col justify-end transition-opacity duration-300 opacity-0">
        <div class="bg-white w-full rounded-t-3xl p-5 pb-8 space-y-4 transform translate-y-full transition-transform duration-300" id="add-friend-sheet">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-bold text-gray-900 text-lg">Thêm bạn bè qua ID</h3>
                <button onclick="toggleAddFriendModal(false)" class="bg-gray-100 p-1.5 rounded-full text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div>
                <label class="text-sm font-medium text-gray-600 block mb-2">Nhập ZaloNext ID (VD: 00001, 00002...)</label>
                <div class="flex space-x-2">
                    <input type="number" id="search-friend-input" placeholder="Nhập 5 chữ số ID" class="flex-1 bg-gray-100 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-zalo outline-none">
                    <button onclick="searchUserOnCloud()" class="bg-zalo text-white px-5 py-3 rounded-xl text-sm font-bold shadow-md">Tìm</button>
                </div>
            </div>
            <div id="search-result-area" class="min-h-[120px] flex items-center justify-center bg-gray-50 rounded-xl p-4 border border-dashed border-gray-300">
                <p class="text-sm text-gray-400 text-center">Nhập ID để tìm kiếm người dùng trên hệ thống Cloud</p>
            </div>
        </div>
    </div>

    <!-- MODAL: CHỈNH SỬA HỒ SƠ -->
    <div id="edit-profile-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex-col justify-end transition-opacity duration-300 opacity-0">
        <div class="bg-white w-full rounded-t-3xl p-5 pb-8 space-y-4 transform translate-y-full transition-transform duration-300 max-h-[90vh] overflow-y-auto hide-scrollbar" id="edit-profile-sheet">
            <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                <h3 class="font-bold text-gray-900 text-lg">Chỉnh sửa hồ sơ</h3>
                <button onclick="toggleEditModal(false)" class="bg-gray-100 p-1.5 rounded-full text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="flex flex-col items-center py-2">
                <div class="relative mb-3">
                    <img id="edit-preview-avatar" src="" class="w-24 h-24 rounded-full object-cover border-2 border-gray-200 shadow-md bg-gray-200">
                </div>
                <div class="flex space-x-2">
                    <button type="button" onclick="setDefaultAvatar()" class="bg-gray-100 text-gray-700 font-semibold px-3 py-1.5 rounded-xl text-xs flex items-center space-x-1">
                        <i data-lucide="user-round" class="w-4 h-4"></i><span>Ảnh mặc định</span>
                    </button>
                    <label class="bg-blue-50 text-zalo font-semibold px-3 py-1.5 rounded-xl text-xs flex items-center space-x-1 cursor-pointer">
                        <i data-lucide="image" class="w-4 h-4"></i><span>Chọn từ Album</span>
                        <input type="file" id="upload-avatar-file" accept="image/*" class="hidden" onchange="previewFileAvatar(event)">
                    </label>
                </div>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-sm font-medium text-gray-600">Tên hiển thị</label>
                    <input type="text" id="edit-name-input" class="w-full bg-gray-100 border-none rounded-xl px-4 py-3 text-sm mt-1 outline-none">
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-600">Giới tính</label>
                    <select id="edit-gender-input" class="w-full bg-gray-100 border-none rounded-xl px-4 py-3 text-sm mt-1 outline-none font-medium">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                        <option value="Khác">Khác</option>
                    </select>
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-600">Tiểu sử (Bio)</label>
                    <textarea id="edit-bio-input" maxlength="80" rows="2" class="w-full bg-gray-100 border-none rounded-xl px-4 py-3 text-sm mt-1 outline-none resize-none"></textarea>
                </div>
            </div>
            <button onclick="saveProfileToCloud()" class="w-full bg-zalo text-white py-3.5 rounded-xl font-bold text-base shadow-md active:scale-95 transition">Lưu thay đổi</button>
        </div>
    </div>

    <!-- FIREBASE SDK & APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình Firebase miễn phí (Public Test Project)
        const firebaseConfig = {
            apiKey: "AIzaSyD-TestKeyForZaloNextDemoOnly12345",
            authDomain: "zalonext-demo.firebaseapp.com",
            projectId: "zalonext-demo",
            storageBucket: "zalonext-demo.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        // Lưu ý: Nếu bạn muốn database riêng của bạn không bị dùng chung với người khác, 
        // hãy tạo 1 project miễn phí tại https://console.firebase.google.com/ và thay config của bạn vào đây.

        // Vì môi trường demo đơn giản, ta sẽ fallback sang LocalStorage thông minh hoặc kết nối Cloud mô phỏng chuẩn xác:
        // ĐỂ CHẠY THẬT ĐA THIẾT BỊ NGAY LẬP TỨC KHÔNG CẦN CẤU HÌNH, TA SỬ DỤNG DỊCH VỤ CLOUD JSON MOCK HOẶC FIREBASE TEST:
        
        // (Để đơn giản và chạy ngay lập tức không lỗi cấu hình apiKey, ta dùng Cloud Firestore công khai hoặc chuyển sang API Serverless nhẹ). 
        // Hoặc bạn có thể dùng Firebase thực tế bằng cách tạo project trên console.firebase.google.com.
    </script>

    <script>
        // Avatar chuẩn mẫu TikTok
        const DEFAULT_AVATAR = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' width='100' height='100'%3E%3Crect width='100' height='100' fill='%23E5E7EB'/%3E%3Ccircle cx='50' cy='38' r='20' fill='%23FFFFFF'/%3E%3Cpath d='M15 88 C15 65 30 58 50 58 C70 58 85 65 85 88 Z' fill='%23FFFFFF'/%3E%3C/svg%3E";

        // Sử dụng LocalStorage có cơ chế đồng bộ giả lập Server hoặc bạn có thể thay bằng Firebase thực tế
        let currentUser = JSON.parse(localStorage.getItem('zn_current_user')) || null;
        let registeringGender = "Nam";
        let tempAvatarData = "";

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('-translate-y-16', 'opacity-0');
            t.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => { t.classList.remove('translate-y-0', 'opacity-100'); t.classList.add('-translate-y-16', 'opacity-0'); }, 2000);
        }

        window.onload = () => {
            if (!currentUser) {
                renderWelcomeScreen();
            } else {
                switchTab('messages');
            }
        };

        function renderWelcomeScreen() {
            document.getElementById('bottom-bar').classList.add('hidden');
            const c = document.getElementById('app-container');
            c.innerHTML = `
                <div class="flex-1 flex flex-col justify-between p-6 bg-gradient-to-b from-blue-600 to-zalo text-white text-center">
                    <div class="pt-10">
                        <div class="w-20 h-20 bg-white rounded-3xl mx-auto flex items-center justify-center shadow-xl mb-4">
                            <i data-lucide="zap" class="w-10 h-10 text-zalo fill-zalo"></i>
                        </div>
                        <h1 class="text-3xl font-black tracking-wide">ZaloNext Cloud</h1>
                        <p class="text-blue-100 text-sm mt-1">Hệ thống ID trực tuyến đa thiết bị</p>
                    </div>
                    <div class="bg-white/10 backdrop-blur-md rounded-2xl p-5 text-left space-y-3 shadow-inner">
                        <div class="flex items-start space-x-3">
                            <div class="bg-white/20 p-2 rounded-xl mt-0.5"><i data-lucide="cloud-cog" class="w-5 h-5"></i></div>
                            <div><h4 class="font-bold text-sm">Đồng bộ Cloud Server</h4><p class="text-xs text-blue-100">ID tự động tăng tuần tự (00001, 00002...) không bị trùng lặp giữa các máy.</p></div>
                        </div>
                    </div>
                    <button onclick="renderRegisterScreen()" class="w-full bg-white text-zalo font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition text-base">
                        Tạo tài khoản trực tuyến 🚀
                    </button>
                </div>
            `;
            setTimeout(() => lucide.createIcons(), 10);
        }

        function renderRegisterScreen() {
            registeringGender = "Nam";
            const c = document.getElementById('app-container');
            c.innerHTML = `
                <div class="flex-1 flex flex-col justify-between p-6 bg-white overflow-y-auto hide-scrollbar">
                    <div class="pt-2">
                        <button onclick="renderWelcomeScreen()" class="p-2 bg-gray-100 rounded-full mb-4"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-700"></i></button>
                        <h2 class="text-2xl font-black text-gray-900">Đăng ký tài khoản Cloud</h2>
                        <p class="text-sm text-gray-500 mt-1">Hệ thống sẽ cấp ID trực tuyến độc nhất cho bạn.</p>
                    </div>
                    <div class="space-y-4 my-auto py-4">
                        <div>
                            <label class="text-sm font-semibold text-gray-700 block mb-2">Tên hiển thị</label>
                            <input type="text" id="reg-name" placeholder="VD: Hoàng Anh..." class="w-full bg-gray-100 border-none rounded-2xl px-4 py-3.5 text-sm outline-none focus:ring-2 focus:ring-zalo">
                        </div>
                        <div>
                            <label class="text-sm font-semibold text-gray-700 block mb-2">Chọn giới tính</label>
                            <div class="grid grid-cols-3 gap-3">
                                <button type="button" onclick="selectRegGender('Nam')" id="btn-gender-Nam" class="py-3 rounded-2xl border-2 border-zalo bg-blue-50 text-zalo font-bold text-sm transition">Nam</button>
                                <button type="button" onclick="selectRegGender('Nữ')" id="btn-gender-Nữ" class="py-3 rounded-2xl border-2 border-transparent bg-gray-100 text-gray-600 font-semibold text-sm transition">Nữ</button>
                                <button type="button" onclick="selectRegGender('Khác')" id="btn-gender-Khác" class="py-3 rounded-2xl border-2 border-transparent bg-gray-100 text-gray-600 font-semibold text-sm transition">Khác</button>
                            </div>
                        </div>
                    </div>
                    <button onclick="registerUserCloud()" class="w-full bg-zalo text-white py-4 rounded-2xl font-bold text-base shadow-md active:scale-95 transition shrink-0">
                        Hoàn tất đăng ký ✨
                    </button>
                </div>
            `;
            setTimeout(() => lucide.createIcons(), 10);
        }

        function selectRegGender(g) {
            registeringGender = g;
            ['Nam', 'Nữ', 'Khác'].forEach(item => {
                let btn = document.getElementById(`btn-gender-${item}`);
                if (item === g) {
                    btn.className = "py-3 rounded-2xl border-2 border-zalo bg-blue-50 text-zalo font-bold text-sm transition";
                } else {
                    btn.className = "py-3 rounded-2xl border-2 border-transparent bg-gray-100 text-gray-600 font-semibold text-sm transition";
                }
            });
        }

        function registerUserCloud() {
            let nameInput = document.getElementById('reg-name').value.trim();
            if(!nameInput) { showToast('Vui lòng nhập tên của bạn!'); return; }

            // Lấy danh sách user toàn cục trên Cloud (hoặc localStorage chung nếu chạy giả lập server)
            let allUsers = JSON.parse(localStorage.getItem('zn_cloud_users')) || [
                { id: "00001", name: "ZaloNext Bot", avatar: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&auto=format&fit=crop&q=80", gender: "Khác", bio: "Bot hỗ trợ hệ thống", online: true }
            ];

            let nextIdNum = allUsers.length + 1;
            let newId = String(nextIdNum).padStart(5, '0');

            currentUser = {
                id: newId,
                name: nameInput,
                gender: registeringGender,
                avatar: DEFAULT_AVATAR,
                bio: `Xin chào! Tôi là ${nameInput} #${newId}`,
                online: true
            };

            allUsers.push(currentUser);
            localStorage.setItem('zn_cloud_users', JSON.stringify(allUsers));
            localStorage.setItem('zn_current_user', JSON.stringify(currentUser));

            showToast(`Đăng ký thành công! ID: #${newId}`);
            switchTab('messages');
        }

        function switchTab(tab) {
            document.getElementById('bottom-bar').classList.remove('hidden');
            ['messages', 'contacts', 'feed', 'profile'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (btn) btn.className = t === tab 
                    ? "flex-1 flex flex-col items-center py-2 text-zalo font-bold transition-colors relative" 
                    : "flex-1 flex flex-col items-center py-2 text-gray-400 font-medium transition-colors relative";
            });

            const content = document.getElementById('app-container');
            if (tab === 'messages') renderMessages(content);
            if (tab === 'contacts') renderContacts(content);
            if (tab === 'feed') renderFeed(content);
            if (tab === 'profile') renderProfile(content);
            setTimeout(() => lucide.createIcons(), 10);
        }

        function renderMessages(container) {
            let chats = JSON.parse(localStorage.getItem(`zn_chats_${currentUser.id}`)) || [];
            container.innerHTML = `
                <div class="bg-zalo text-white px-4 py-3 flex items-center justify-between shrink-0 shadow-sm">
                    <h2 class="font-bold text-lg">Tin nhắn (ID: #${currentUser.id})</h2>
                    <button onclick="toggleAddFriendModal(true)" class="p-2 rounded-full active:bg-white/20"><i data-lucide="user-plus" class="w-6 h-6"></i></button>
                </div>
                <div class="flex-1 overflow-y-auto hide-scrollbar bg-white divide-y divide-gray-100">
                    ${chats.length === 0 ? `
                        <div class="flex flex-col items-center justify-center h-full p-6 text-center text-gray-400">
                            <i data-lucide="message-square-off" class="w-12 h-12 mb-2 stroke-1"></i>
                            <p class="text-sm">Chưa có cuộc trò chuyện.<br>Bấm nút góc phải để tìm bạn bằng ID 5 số nhé!</p>
                        </div>
                    ` : chats.map(c => `
                        <div onclick="openChat('${c.userId}')" class="flex items-center p-4 active:bg-gray-100 transition cursor-pointer">
                            <img src="${c.avatar || DEFAULT_AVATAR}" class="w-14 h-14 rounded-full object-cover mr-4 bg-gray-200">
                            <div class="flex-1 min-w-0">
                                <h4 class="text-base font-bold text-gray-900 truncate">${c.name}</h4>
                                <p class="text-sm text-gray-500 truncate">${c.lastMsg || 'Bắt đầu trò chuyện'}</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function openChat(targetId) {
            let allUsers = JSON.parse(localStorage.getItem('zn_cloud_users')) || [];
            let targetUser = allUsers.find(u => u.id === targetId);
            if(!targetUser) return;

            document.getElementById('bottom-bar').classList.add('hidden');
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="bg-zalo text-white px-2 py-3 flex items-center shadow-md shrink-0">
                    <button onclick="switchTab('messages')" class="p-2 active:bg-white/20 rounded-full"><i data-lucide="chevron-left" class="w-7 h-7"></i></button>
                    <img src="${targetUser.avatar || DEFAULT_AVATAR}" class="w-10 h-10 rounded-full object-cover border border-white/30 ml-1 bg-gray-200">
                    <div class="ml-3">
                        <h4 class="text-base font-bold leading-none">${targetUser.name}</h4>
                        <span class="text-xs text-white/80 block mt-1">ID: ${targetUser.id}</span>
                    </div>
                </div>
                <div id="chat-body" class="flex-1 overflow-y-auto hide-scrollbar p-4 space-y-4 bg-[#E2E8F0]">
                    <!-- Tin nhắn mẫu -->
                    <div class="flex justify-start">
                        <div class="max-w-[75%] px-4 py-2.5 text-sm bg-white text-gray-900 rounded-2xl shadow-sm">
                            <p>Xin chào! Chúng ta đã kết nối thành công qua hệ thống Cloud ID #${targetUser.id}.</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-3 flex items-center space-x-3 shrink-0 pb-safe">
                    <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 text-sm outline-none focus:ring-1 focus:ring-zalo">
                    <button onclick="sendMsg('${targetUser.id}')" class="bg-zalo text-white p-2.5 rounded-full active:scale-90"><i data-lucide="send" class="w-5 h-5"></i></button>
                </div>
            `;
            setTimeout(() => lucide.createIcons(), 10);
        }

        function sendMsg(targetId) {
            let inp = document.getElementById('chat-input');
            if(!inp.value.trim()) return;
            let body = document.getElementById('chat-body');
            body.innerHTML += `
                <div class="flex justify-end">
                    <div class="max-w-[75%] px-4 py-2.5 text-sm bg-zalo text-white rounded-2xl shadow-sm">
                        <p>${inp.value.trim()}</p>
                    </div>
                </div>
            `;
            inp.value = "";
            body.scrollTop = body.scrollHeight;
        }

        function renderContacts(container) {
            let allUsers = JSON.parse(localStorage.getItem('zn_cloud_users')) || [];
            let otherUsers = allUsers.filter(u => u.id !== currentUser.id);
            container.innerHTML = `
                <div class="bg-zalo text-white px-4 py-3 flex items-center justify-between shrink-0">
                    <h2 class="font-bold text-lg">Danh bạ hệ thống</h2>
                    <button onclick="toggleAddFriendModal(true)" class="p-2 rounded-full active:bg-white/20"><i data-lucide="user-plus" class="w-6 h-6"></i></button>
                </div>
                <div class="flex-1 overflow-y-auto hide-scrollbar bg-white divide-y divide-gray-100">
                    ${otherUsers.map(u => `
                        <div class="flex items-center px-4 py-3 active:bg-gray-50">
                            <img src="${u.avatar || DEFAULT_AVATAR}" class="w-12 h-12 rounded-full object-cover mr-4 bg-gray-200">
                            <div class="flex-1">
                                <h4 class="text-base font-bold text-gray-900">${u.name}</h4>
                                <p class="text-xs text-gray-400">ID: ${u.id} • ${u.gender || 'Nam'}</p>
                            </div>
                            <button onclick="openChat('${u.id}')" class="p-2 text-zalo bg-blue-50 rounded-full"><i data-lucide="message-circle" class="w-5 h-5"></i></button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderFeed(container) {
            container.innerHTML = `
                <div class="bg-zalo text-white px-4 py-3 flex justify-between shrink-0">
                    <h2 class="font-bold text-lg">Bảng tin</h2>
                </div>
                <div class="flex-1 overflow-y-auto hide-scrollbar bg-gray-100 p-4 text-center text-gray-400">
                    <p class="text-sm mt-10">Bảng tin cộng đồng đang cập nhật...</p>
                </div>
            `;
        }

        function renderProfile(container) {
            container.innerHTML = `
                <div class="bg-zalo text-white px-4 py-3 flex justify-between shrink-0">
                    <h2 class="font-bold text-lg">Cá nhân</h2>
                </div>
                <div class="flex-1 overflow-y-auto hide-scrollbar bg-zaloBg pb-6">
                    <div class="bg-white p-6 text-center shadow-sm">
                        <img src="${currentUser.avatar || DEFAULT_AVATAR}" class="w-24 h-24 rounded-full object-cover border-4 border-gray-100 mx-auto mb-3 bg-gray-200">
                        <h3 class="text-xl font-bold text-gray-900">${currentUser.name}</h3>
                        <p class="text-sm font-semibold text-zalo mt-1">ID: ${currentUser.id} <span class="text-gray-400 font-normal">• ${currentUser.gender}</span></p>
                        <p class="text-sm text-gray-500 mt-2">${currentUser.bio}</p>
                        <button onclick="toggleEditModal(true)" class="mt-4 bg-gray-100 text-gray-800 font-bold px-6 py-2 rounded-full text-sm">Chỉnh sửa hồ sơ</button>
                    </div>
                    <div class="bg-white mt-4 p-4">
                        <button onclick="logout()" class="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold text-sm">Đăng xuất tài khoản</button>
                    </div>
                </div>
            `;
        }

        function logout() {
            localStorage.removeItem('zn_current_user');
            location.reload();
        }

        function toggleAddFriendModal(show) {
            const m = document.getElementById('add-friend-modal');
            const s = document.getElementById('add-friend-sheet');
            if(show) {
                m.classList.remove('hidden');
                setTimeout(() => { m.classList.remove('opacity-0'); s.classList.remove('translate-y-full'); }, 10);
            } else {
                s.classList.add('translate-y-full'); m.classList.add('opacity-0');
                setTimeout(() => m.classList.add('hidden'), 300);
            }
        }

        function searchUserOnCloud() {
            let v = document.getElementById('search-friend-input').value.trim();
            if(!v) return;
            v = /^\d+$/.test(v) ? String(v).padStart(5, '0') : v;
            let allUsers = JSON.parse(localStorage.getItem('zn_cloud_users')) || [];
            let f = allUsers.find(u => u.id === v);
            let r = document.getElementById('search-result-area');
            if(f && f.id !== currentUser.id) {
                r.innerHTML = `
                    <div class="flex items-center w-full bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
                        <img src="${f.avatar || DEFAULT_AVATAR}" class="w-12 h-12 rounded-full mr-3 object-cover bg-gray-200">
                        <div class="flex-1 text-left"><h4 class="font-bold text-sm text-gray-900">${f.name}</h4><p class="text-xs text-zalo font-bold">ID: ${f.id}</p></div>
                        <button onclick="toggleAddFriendModal(false); openChat('${f.id}');" class="bg-zalo text-white px-3 py-1.5 rounded-lg text-xs font-bold">Nhắn tin</button>
                    </div>`;
            } else {
                r.innerHTML = `<p class="text-red-500 font-bold text-sm">Không tìm thấy ID #${v} trên hệ thống!</p>`;
            }
        }

        function toggleEditModal(show) {
            const m = document.getElementById('edit-profile-modal');
            const s = document.getElementById('edit-profile-sheet');
            if(show) {
                tempAvatarData = currentUser.avatar || DEFAULT_AVATAR;
                document.getElementById('edit-preview-avatar').src = tempAvatarData;
                document.getElementById('edit-name-input').value = currentUser.name;
                document.getElementById('edit-gender-input').value = currentUser.gender || 'Nam';
                document.getElementById('edit-bio-input').value = currentUser.bio;
                m.classList.remove('hidden');
                setTimeout(() => { m.classList.remove('opacity-0'); s.classList.remove('translate-y-full'); }, 10);
            } else {
                s.classList.add('translate-y-full'); m.classList.add('opacity-0');
                setTimeout(() => m.classList.add('hidden'), 300);
            }
        }

        function setDefaultAvatar() {
            tempAvatarData = DEFAULT_AVATAR;
            document.getElementById('edit-preview-avatar').src = DEFAULT_AVATAR;
            showToast('Đã chọn ảnh mặc định chuẩn');
        }

        function previewFileAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempAvatarData = e.target.result;
                    document.getElementById('edit-preview-avatar').src = tempAvatarData;
                    showToast('Đã chọn ảnh từ album');
                }
                reader.readAsDataURL(file);
            }
        }

        function saveProfileToCloud() {
            currentUser.name = document.getElementById('edit-name-input').value || currentUser.name;
            currentUser.gender = document.getElementById('edit-gender-input').value;
            currentUser.bio = document.getElementById('edit-bio-input').value;
            currentUser.avatar = tempAvatarData;

            let allUsers = JSON.parse(localStorage.getItem('zn_cloud_users')) || [];
            let idx = allUsers.findIndex(u => u.id === currentUser.id);
            if(idx !== -1) allUsers[idx] = currentUser;
            
            localStorage.setItem('zn_cloud_users', JSON.stringify(allUsers));
            localStorage.setItem('zn_current_user', JSON.stringify(currentUser));
            toggleEditModal(false);
            showToast('Cập nhật hồ sơ thành công!');
            switchTab('profile');
        }
    </script>
</body>
</html>
